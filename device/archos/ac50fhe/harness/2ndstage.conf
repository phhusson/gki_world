# Qualcomm MSM8909 / Archos 50f Helium second-stage bootloader data.
# Paths are relative to the repository root.

UBOOT_BASE_DEFCONFIG=gkiw-msm8909_defconfig
UBOOT_FRAGMENT=soc/qcom/msm8909/harness/gkiw-msm8909.config
UBOOT_PATCH_DIRS="soc/qcom/msm8909/harness/patches device/archos/ac50fhe/harness/patches"
UBOOT_BOARD_DTS=msm8909-archos-ac50fhe
UBOOT_PLATFORM=msm8909

# LK loads a raw 32-bit payload; an ARM64 Image header would make it choose the
# AArch64 boot path on a Cortex-A7 SoC.
UBOOT_PAYLOAD=u-boot-dtb.bin
GKIW_FLASH_IMAGE=gkiw-2ndstage-ac50fhe.img
# LK requires a device tree.  `fastboot boot` does not use the separate dt
# partition, so the DTB has to travel inside the boot image.  MSM8909 LK reads
# the old `dt_size` section as a QCDT table; the matching entry was recovered
# from LK's own "Unable to find suitable device tree" log:
#
#   platform_id 245, variant_id 0x0901000b, subtype 9, soc_rev 0x00020000
#
# (Variant/hw id 11, platform subtype 9 in the LK log.)
GKIW_BOOTIMG_COMPRESS=none
GKIW_BOOTIMG_APPEND_DTB=0
GKIW_BOOTIMG_HEADER_SIZE=0
GKIW_BOOTIMG_DUMMY_RAMDISK=1
GKIW_QCDT_PLATFORM_ID=245
GKIW_QCDT_VARIANT_ID=0x0901000b
GKIW_QCDT_HW_SUBTYPE=9
GKIW_QCDT_SOC_REV=0x00020000
GKIW_QCDT_PMIC_REV_0=0
GKIW_QCDT_PMIC_REV_1=0
GKIW_QCDT_PMIC_REV_2=0
GKIW_QCDT_PMIC_REV_3=0

# Values forced by MSM8909 LK's ABOOT_IGNORE_BOOT_HEADER_ADDRS.  They are kept
# in the header too, because its page size still drives image parsing.
GKIW_BOOTIMG_BASE=0x80000000
GKIW_BOOTIMG_PAGESIZE=2048
GKIW_BOOTIMG_HEADER_VERSION=0
GKIW_BOOTIMG_KERNEL_OFFSET=0x00008000
GKIW_BOOTIMG_RAMDISK_OFFSET=0x02000000
GKIW_BOOTIMG_SECOND_OFFSET=0x00f00000
GKIW_BOOTIMG_TAGS_OFFSET=0x01e00000

GKIW_USB_CONTROLLER=ci_udc
GKIW_WDT_TIMEOUT_MS=15000

# LK configures the debug UART pins before this loader runs.  Do not re-apply
# UART pins in the bootloader or Linux DT.
GKIW_CONSOLE=uart

# Defaults for the host pstore helper.  The Linux DT in the boot image MUST
# reserve the same ramoops region, with no-map, or the data is not pstore.
GKIW_PSTORE_ADDR=0x9d000000
GKIW_PSTORE_SIZE=0x00100000

# Persistent 2ndstage console log, two 64 KiB slots.
GKIW_LOG_ADDR=0x9f100000
GKIW_LOG_SIZE=0x00020000

# Fastboot download buffer.  LK's own fastboot scratch is at 0x90100000; this
# memory is free after the chainload, and the 128 MiB window stays below
# U-Boot's 0x9f000000 ceiling.
GKIW_FASTBOOT_ADDR=0x90000000
GKIW_FASTBOOT_SIZE=0x08000000
