# K-Touch i9 / Anica i9 (MediaTek MT6739) second-stage bootloader data.
# Paths are relative to the repository root.

UBOOT_BASE_DEFCONFIG=mt6739_ktouch_i9_defconfig
UBOOT_FRAGMENT=soc/mediatek/mt6739/harness/gkiw-mt6739.config
UBOOT_BOARD_DTS=mediatek/mt6739-ktouch-i9
UBOOT_PLATFORM=ktouch-i9

# Generic gkiw patches live in global/, the MT6739 SoC support in soc/, and
# the K-Touch i9 board tree in this device layer.  The build script sorts all
# of them by basename, so the 0001..0013 series still applies in order.
UBOOT_PATCH_DIRS="soc/mediatek/mt6739/harness/patches device/ktouch/i9/harness/patches"

# Match the stock K-Touch i9 boot image, as used by LineageOS:
#   base 0x40078000, kernel offset 0x8000 -> kernel at 0x40080000
#   ramdisk 0x45000000, second 0x40f00000, tags 0x44000000
# U-Boot lives at 0x40080000 + the 4 KiB ARM64 Image header.  The stock kernel
# is Image.gz and LK needs bootopt to enter AArch64, so compress our payload
# and pass the same boot option.
GKIW_BOOTIMG_BASE=0x40078000
GKIW_BOOTIMG_KERNEL_OFFSET=0x00008000
GKIW_BOOTIMG_RAMDISK_OFFSET=0x04f88000
GKIW_BOOTIMG_SECOND_OFFSET=0x00e88000
GKIW_BOOTIMG_TAGS_OFFSET=0x03f88000
GKIW_BOOTIMG_CMDLINE="bootopt=64S3,32N2,64N2 androidboot.selinux=permissive"
GKIW_BOOTIMG_COMPRESS=gzip
# This LK rejects zero-size ramdisk sections and may derive a zero load address
# from them.  Keep a valid tiny ramdisk so ramdisk_addr is non-zero.
GKIW_BOOTIMG_DUMMY_RAMDISK=1
# LK resets during md1img verification when the boot image loads too fast:
# at ~6.3 s the modem secure-memory retrieve hangs, while a 22 MiB recovery
# image reaches md1img at ~16.5 s and succeeds.  Pad the *kernel section*
# (zeros after the gzip stream, before the DTB) to delay md1img without
# changing the ramdisk/mblock layout and triggering a reserved-memory conflict.
# Pad the kernel section to avoid the md1img timing reset.  The 22 MiB
# recovery image reaches md1img at ~16.5 s and succeeds; the tiny 2ndstage
# reaches it at ~6.3 s and trips the modem secure-memory retrieve.
GKIW_BOOTIMG_KERNEL_PAD_SIZE=0x1400000
# Stock Image.gz carries an appended DTB; LK looks for it, uses it for
# dconfig/DTBO overlays and then jumps.  U-Boot ignores the incoming x0 pointer
# and uses its own appended tree, but LK needs a *device* DTB here, not
# u-boot.dtb.  Extract it from the stock/Lineage image and pass it as:
#   GKIW_BOOTIMG_DTB=/path/to/stock.dtb scripts/build.sh ...
# See global/harness/2ndstage/scripts/extract-dtb.sh.
GKIW_BOOTIMG_APPEND_DTB=1
GKIW_BOOTIMG_HEADER_SIZE=0x1000
GKIW_BOOTIMG_PAGESIZE=2048

GKIW_USB_CONTROLLER=musb

# UART0 at 0x11002000, the MTK first-stage console.  The pinmux is inherited.
# The watchdog timeout lives in the U-Boot fragment: the MT6739 TOPRGU counter
# is 16-bit at 32768 Hz, so it uses 15 s instead of the G12A 60 s.
GKIW_CONSOLE=uart0

# The device tree used by Linux must reserve the same ramoops region, with
# no-map.  The region below is below U-Boot's heap and stack.
GKIW_PSTORE_ADDR=0x5c000000
GKIW_PSTORE_SIZE=0x00100000

# Persistent 2ndstage console log, two 64 KiB slots.
GKIW_LOG_ADDR=0x5c100000
GKIW_LOG_SIZE=0x00020000
