# K-Touch i9 (MT6739) boot image data.
#
# The stock LK first stage loads gkiw-2ndstage-flash.img; the gkiw second stage
# then loads the Linux image described below with `fastboot boot`.
#
# Layout verified against the LineageOS/TWRP recovery.img for this device.
# TODO: verify AVB, and extract the stock boot.img if it differs.

format: android-boot-v0
pagesize: 2048
cmdline: >-
  console=ttyS0,921600n8 earlycon=uart8250,mmio32,0x11002000,921600n8
  keep_bootcon ignore_loglevel
compression: gzip
avb: unknown

# The second stage matches the stock/Lineage image layout: base 0x40078000,
# kernel offset 0x8000, so LK loads the payload at 0x40080000. The payload is
# a 4 KiB ARM64 Image header in front of U-Boot, gzip-compressed like the stock
# Image.gz, with LK's bootopt cmdline.  Stock Image.gz has the DTB appended
# after the gzip stream and an empty `second` section; u-boot.dtb is appended
# the same way (`GKIW_BOOTIMG_APPEND_DTB=1`).
secondstage:
  base: 0x40078000
  kernel_offset: 0x00008000
  kernel_addr: 0x40080000
  header_size: 0x1000
  text_base: 0x40081000
  compress: gzip
  append_dtb: true
  cmdline: "bootopt=64S3,32N2,64N2 androidboot.selinux=permissive"

# Linux must not be placed where U-Boot or the fastboot buffer lives.
# Match the stock base/tags/second offsets.  The kernel is moved from
# 0x40080000 to 0x45000000 because U-Boot occupies the stock kernel area.
# The vendor devicetree reserves 0x44400000..0x44500000 for LK/preloader
# ram_console, pstore and minirdump, so keep the kernel above it.
layout:
  base: 0x40078000
  kernel_offset: 0x04f88000   # 0x45000000, up to 80 MiB
  ramdisk_offset: 0x09f88000  # 0x4a000000, up to 80 MiB
  second_offset: 0x00e88000   # 0x40f00000 (stock second address)
  tags_offset: 0x03f88000     # 0x44000000 (stock tags address)

memory:
  base: 0x40000000
  size: 0x20000000            # 512 MiB development floor

reserved_memory:
  pstore: 0x5c000000
  pstore_size: 0x00100000
  secondstage_log: 0x5c100000
  secondstage_log_size: 0x00020000

template:
  dump: null                  # TODO: add a stock boot dump name and sha256
  sha256: null

first_stage:
  required: true
  note: >-
    The stock preloader/LK must boot an unsigned image and expose fastboot.
    The 2ndstage is flashed to `boot` (or booted with `fastboot boot`); it does
    not replace the signed preloader or LK.
