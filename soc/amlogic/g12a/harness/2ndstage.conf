# Amlogic G12A / S905X2 second-stage bootloader data.
# Paths are relative to the repository root.

UBOOT_BASE_DEFCONFIG=u200_defconfig
UBOOT_FRAGMENT=soc/amlogic/g12a/harness/gkiw-g12a.config
UBOOT_BOARD_DTS=amlogic/meson-g12a-gkiw
UBOOT_PLATFORM=g12a

# Generic gkiw patches are in global/harness/2ndstage/patches; the G12A
# devicetree, memory-size and board hooks are SoC data.
UBOOT_PATCH_DIRS="soc/amlogic/g12a/harness/patches"

# boot.img layout: the G12A first stage loads the kernel at 0x08000000 (above
# the low 128 MiB reserved for the secure world/first stage, and away from the
# vendor DTB at 0x01000000). The first 4 KiB are an ARM64 Image header that
# branches to U-Boot at 0x08001000.
GKIW_BOOTIMG_BASE=0x08000000
GKIW_BOOTIMG_HEADER_SIZE=0x1000
GKIW_BOOTIMG_PAGESIZE=2048

GKIW_USB_CONTROLLER=dwc2

# This box routes UART over the SD card pads with a special pinmux configured
# by the first stage. Never re-apply u200 pins in the bootloader or Linux DT:
# it changes the RX pad and leaves TX-only output.
GKIW_CONSOLE=uart-over-sd

# Defaults for the host pstore helper. The device tree booted by Linux MUST
# reserve the same region as ramoops, with no-map, or the data is not pstore.
# The layout assumes at least 512 MiB of RAM and keeps the first 128 MiB free
# for the secure world / first stage.
GKIW_PSTORE_ADDR=0x1c000000
GKIW_PSTORE_SIZE=0x00100000
