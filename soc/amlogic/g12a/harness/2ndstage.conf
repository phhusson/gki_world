# Amlogic G12A / S905X2 second-stage bootloader data.
# Paths are relative to the repository root.

UBOOT_BASE_DEFCONFIG=u200_defconfig
UBOOT_FRAGMENT=soc/amlogic/g12a/harness/gkiw-g12a.config
UBOOT_BOARD_DTS=amlogic/meson-g12a-gkiw

# boot.img layout: the G12A first stage loads the kernel at 0x01000000, the
# first 4 KiB are an ARM64 Image header that branches to U-Boot at 0x01001000.
GKIW_BOOTIMG_BASE=0x01000000
GKIW_BOOTIMG_HEADER_SIZE=0x1000
GKIW_BOOTIMG_PAGESIZE=2048

GKIW_USB_CONTROLLER=dwc2
GKIW_WDT_TIMEOUT_MS=60000

# Defaults for the host pstore helper. The device tree booted by Linux MUST
# reserve the same region as ramoops, with no-map, or the data is not pstore.
# The layout assumes at least 512 MiB of RAM and keeps the first 128 MiB free
# for the secure world / first stage.
GKIW_PSTORE_ADDR=0x1c000000
GKIW_PSTORE_SIZE=0x00100000
