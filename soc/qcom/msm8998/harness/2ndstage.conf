# Qualcomm MSM8998 / F(x)tec Pro1 second-stage bootloader data.
# Paths are relative to the repository root.

UBOOT_BASE_DEFCONFIG=qcom_defconfig
UBOOT_EXTRA_FRAGMENTS=board/qualcomm/qcom-phone.config
UBOOT_FRAGMENT=soc/qcom/msm8998/harness/gkiw-msm8998.config
UBOOT_PATCH_DIRS="soc/qcom/msm8998/harness/patches device/fxtec/pro1/harness/patches"
UBOOT_BOARD_DTS=qcom/msm8998-fxtec-pro1
UBOOT_PLATFORM=msm8998

# Qualcomm ABL wants a gzipped kernel with the DTB appended to it, not an
# ARM64 Image header in front of the payload.
UBOOT_PAYLOAD=u-boot-nodtb.bin
GKIW_FLASH_IMAGE=gkiw-2ndstage-pro1.img
GKIW_BOOTIMG_COMPRESS=gzip
GKIW_BOOTIMG_APPEND_DTB=1

# Header v1, 4096-byte pages and these offsets are the ones in the stock
# Pro1 boot image.  ABL uses them to find the payload; the load address is
# not where the code actually runs.
GKIW_BOOTIMG_BASE=0x0
GKIW_BOOTIMG_HEADER_SIZE=0
GKIW_BOOTIMG_PAGESIZE=4096
GKIW_BOOTIMG_HEADER_VERSION=1
GKIW_BOOTIMG_KERNEL_OFFSET=0x00008000
GKIW_BOOTIMG_RAMDISK_OFFSET=0x01000000
GKIW_BOOTIMG_SECOND_OFFSET=0x00f00000
GKIW_BOOTIMG_TAGS_OFFSET=0x00000100
GKIW_BOOTIMG_OS_VERSION=9.0.0
GKIW_BOOTIMG_OS_PATCH_LEVEL=2020-04

# The Pro1 boot partition is 64 MiB and the stock image has an AVB footer at
# the very end.  A small unsigned image leaves that footer in place, so the
# bootloader verifies the old hash and falls back to fastboot.  Write a full
# partition image with zeros after the payload to erase the stale footer.
# If AVB is still enforced, disable verification on the vbmeta partition too.
GKIW_BOOTIMG_IMAGE_PAD_SIZE=0x4000000

GKIW_USB_CONTROLLER=dwc3
GKIW_WDT_TIMEOUT_MS=60000

# ABL configures the debug UART pins before this loader runs.  Do not
# re-apply UART pins in the bootloader or Linux DT.
GKIW_CONSOLE=uart

# Defaults for the host pstore helper.  The Linux DT in the boot image MUST
# reserve the same ramoops region, with no-map, or the data is not pstore.
# These are the values the mainline Pro1 tree uses.
GKIW_PSTORE_ADDR=0xffc00000
GKIW_PSTORE_SIZE=0x00100000

# Persistent 2ndstage console log, two 64 KiB slots.
GKIW_LOG_ADDR=0xffd00000
GKIW_LOG_SIZE=0x00020000

# Fastboot download buffer below 4 GiB, above the reserved windows and
# below the loader's ceiling.
GKIW_FASTBOOT_ADDR=0xa0000000
GKIW_FASTBOOT_SIZE=0x08000000
